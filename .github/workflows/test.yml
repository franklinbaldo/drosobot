name: Tests and Linux gateway
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Protocol tests (no real robot access)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Browser photon lab protocol and HTTP tests (loopback only)
        run: python -m unittest discover -s experiments/photon_mesh_web -p 'test_*.py' -v
      - name: Check browser receiver JavaScript
        run: node --check experiments/photon_mesh_web/app.js
  rust-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Unit and protocol tests
        run: cargo +stable test --manifest-path rust/drosobot-gateway/Cargo.toml --all-targets
      - name: Linux release binary
        run: cargo +stable build --release --manifest-path rust/drosobot-gateway/Cargo.toml
      - name: Archive Linux binary
        run: |
          mkdir -p dist
          cp rust/drosobot-gateway/target/release/drosobot dist/
          sha256sum dist/drosobot > dist/SHA256SUMS
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: drosobot-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
  rust-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Synthetic-world unit and closed-loop tests (no hardware)
        run: cargo +stable test --manifest-path rust/drosobot-sim/Cargo.toml --all-targets
      - name: Deterministic baseline demonstration
        run: cargo +stable run --release --manifest-path rust/drosobot-sim/Cargo.toml
      - name: Fictional Wi-Fi fingerprint demo (no collection)
        run: cargo +stable run --release --manifest-path rust/drosobot-sim/Cargo.toml --bin wifi_demo
      - name: Virtual photon field reconstruction and replay (no hardware)
        run: cargo +stable run --release --manifest-path rust/drosobot-sim/Cargo.toml --bin photon_field_demo
      - name: Package photon lab binary from CI
        run: |
          mkdir -p dist-photon
          cp rust/drosobot-sim/target/release/photon_field_demo dist-photon/
          sha256sum dist-photon/photon_field_demo > dist-photon/SHA256SUMS
      - name: Publish photon lab artifact (IFRO, no local compile)
        uses: actions/upload-artifact@v4
        with:
          name: drosobot-photon-lab-linux-amd64
          path: dist-photon/
          if-no-files-found: error
          retention-days: 14
  embree-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native Embree 4 API in ephemeral CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libembree-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build native Embree producer and Rust verifier
        run: |
          mkdir -p dist-embree
          g++ -std=c++17 -O3 -DNDEBUG -march=x86-64 \
            benchmarks/lighting_cpu/embree_photon_events.cpp -lembree4 \
            -o dist-embree/embree_photon_events
          cargo +stable test --manifest-path rust/drosobot-sim/Cargo.toml --bin photon_embree_ingest
          cargo +stable build --release --manifest-path rust/drosobot-sim/Cargo.toml --bin photon_embree_ingest
          cp rust/drosobot-sim/target/release/photon_embree_ingest dist-embree/
      - name: Compile Embree optical-range sensor and test 10-second synthetic behaviour
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -march=x86-64 \
            experiments/behavior_lab/embree_sensor.cpp -lembree4 \
            -o dist-embree/embree_sensor
          python3 -m unittest discover -s experiments/behavior_lab -p 'test_model.py' -v
          python3 -m compileall -q experiments/behavior_lab
          printf '1 1 0.3\n' | dist-embree/embree_sensor | grep -E '^[0-9]+[.]'
          python3 -u experiments/behavior_lab/run.py \
            --sensor dist-embree/embree_sensor \
            --output dist-embree/behavior-smoke.json --duration 10 --fast
          python3 experiments/behavior_lab/report.py \
            --summary dist-embree/behavior-smoke.json \
            --log dist-embree/behavior-smoke.jsonl \
            --output dist-embree/behavior-smoke.html
          python3 -c "from pathlib import Path; import json; d=json.loads(Path('dist-embree/behavior-smoke.json').read_text()); assert d['ticks']==100 and d['paced_realtime'] is False; assert Path('dist-embree/behavior-smoke.html').stat().st_size>3000; print('Synthetic behavior smoke PASS')"
      - name: Nomos A/B/C/D map localization with synthetic network fixture (no real IP)
        run: |
          python3 -m unittest discover -s experiments/spatial_inference -p 'test_*.py' -v
          python3 -m compileall -q experiments/spatial_inference
          g++ -std=c++17 -O2 -DNDEBUG -march=x86-64 \
            experiments/spatial_inference/embree_angles.cpp -lembree4 \
            -o dist-embree/embree_angles
          python3 -u experiments/behavior_lab/run.py \
            --sensor dist-embree/embree_sensor \
            --output dist-embree/nomos-synthetic-truth.json \
            --duration 600 --fast
          python3 experiments/spatial_inference/compare.py \
            --truth dist-embree/nomos-synthetic-truth.jsonl \
            --network experiments/spatial_inference/test-network-fixture.json \
            --test-fixture-network \
            --embree-oracle dist-embree/embree_angles --particles 64 \
            --output dist-embree/nomos-fixture-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('dist-embree/nomos-fixture-report.json').read_text())
          assert report['network']['source']=='synthetic_test_fixture'
          assert report['network']['not_spatial_ranging'] is True
          assert report['network']['live_client_positions_known'] is False
          assert report['comparability']['B_C_D_ray_queries_per_second']==3
          assert all(report['metrics'][arm]['observed_ray_samples']==1800 for arm in 'BCD')
          assert report['metrics']['A']['observed_ray_samples']==0
          assert report['benchmark']['native_embree_3ray_calls']==1800
          print('Nomos synthetic CI arms validated; no real mesh precision claim')
          PY
      - name: End-to-end Embree rays to DPH1 to reconstructed scene
        run: |
          dist-embree/embree_photon_events --output dist-embree/source_journal.dph1
          test "$(wc -c < dist-embree/source_journal.dph1)" = 712
          dist-embree/photon_embree_ingest --input dist-embree/source_journal.dph1
          python3 -c "import sys; sys.path.insert(0, 'experiments/photon_mesh_web'); from server import decode_packets; from pathlib import Path; packets=decode_packets(Path('dist-embree/source_journal.dph1').read_bytes()); assert len(packets)==17; print('Web SSE decoder compatible with actual Embree journal')"
          python3 -c "from pathlib import Path; b=Path('dist-embree/source_journal.dph1').read_bytes(); assert b.startswith(b'DPH1'); b=bytearray(b);b[23]^=1;Path('dist-embree/tampered_journal.dph1').write_bytes(b)"
          if dist-embree/photon_embree_ingest --input dist-embree/tampered_journal.dph1; then
            echo 'ERROR: Tampered event journal unexpectedly passed verification'
            exit 1
          fi
          rm dist-embree/tampered_journal.dph1
          if dist-embree/embree_photon_events --output dist-embree/source_journal.dph1; then
            echo 'ERROR: Existing journal was overwritten'
            exit 1
          fi
          (cd dist-embree && sha256sum embree_photon_events photon_embree_ingest > SHA256SUMS)
      - name: Publish Linux binaries for IFRO (no Rust compile on IFRO)
        uses: actions/upload-artifact@v4
        with:
          name: drosobot-embree-dph1-linux-amd64
          path: |
            dist-embree/embree_photon_events
            dist-embree/photon_embree_ingest
            dist-embree/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  malecns-shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build neural reader and tests
        run: cargo +stable test --manifest-path rust/drosobot-sim/Cargo.toml --all-targets
      - name: Fetch and verify pinned public MaleCNS source (no home network)
        run: python scripts/prepare_malecns.py --output .research/malecns-verified
      - name: Run frozen MaleCNS shadow observer and target-label null
        run: |
          cargo +stable run --release --manifest-path rust/drosobot-sim/Cargo.toml --bin malecns_probe -- .research/malecns-verified/connectome.mcns .research/malecns-verified/ports.txt
